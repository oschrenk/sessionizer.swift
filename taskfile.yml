version: '3'
dotenv: ['VERSION']
vars:
  APP_NAME: "Sessionizer"
  APP_DIR: "$HOME/Applications"
  RELEASE_DIR: ".build/release"
  BUNDLE: ".build/{{.APP_NAME}}.app"
  SWIFT_VERSION: "6.4"
tasks:
  build:
    watch: true
    sources:
      - '**/*.swift'
    cmds:
      - swift build
    silent: true
  test:
    cmds:
      - swift test
    silent: true
  format:
    cmds:
      - swiftformat --swiftversion {{.SWIFT_VERSION}} Package.swift Sources Tests
    silent: true
  lint:
    cmds:
      - swiftlint
    silent: true
  font:
    vars:
      URL: https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMonoNormal-NF.zip
      SHA256: df1c1a5ee784c28a1ad228ae1335d3bb8239ac483db9db7f3ba986104e069772
    status:
      - test -f .build/fonts/MapleMonoNormal-NF-Italic.ttf
    cmds:
      - mkdir -p .build/fonts
      - curl -fsSL -o .build/fonts/maple.zip "{{.URL}}"
      - echo "{{.SHA256}}  .build/fonts/maple.zip" | shasum -a 256 -c -
      - unzip -o -j -q .build/fonts/maple.zip MapleMonoNormal-NF-Italic.ttf -d .build/fonts
      - rm .build/fonts/maple.zip
    silent: true
  icon:
    deps: [font]
    sources:
      - Scripts/icon.swift
    generates:
      - Resources/AppIcon.icns
    cmds:
      - rm -rf .build/AppIcon.iconset && mkdir -p .build/AppIcon.iconset
      - swift Scripts/icon.swift .build/icon-1024.png .build/fonts/MapleMonoNormal-NF-Italic.ttf
      - for s in 16 32 128 256 512; do
          sips -z $s $s .build/icon-1024.png --out .build/AppIcon.iconset/icon_${s}x${s}.png > /dev/null;
          sips -z $((s*2)) $((s*2)) .build/icon-1024.png --out .build/AppIcon.iconset/icon_${s}x${s}@2x.png > /dev/null;
        done
      - iconutil -c icns .build/AppIcon.iconset -o Resources/AppIcon.icns
    silent: true
  bundle:
    deps: [icon]
    cmds:
      - swift build --configuration release --disable-sandbox --arch arm64
      - rm -rf "{{.BUNDLE}}"
      - mkdir -p "{{.BUNDLE}}/Contents/MacOS" "{{.BUNDLE}}/Contents/Resources"
      - cp "{{.RELEASE_DIR}}/{{.APP_NAME}}" "{{.BUNDLE}}/Contents/MacOS/"
      - sed "s/APP_VERSION/${APP_VERSION#v}/g" Resources/Info.plist > "{{.BUNDLE}}/Contents/Info.plist"
      - cp Resources/AppIcon.icns "{{.BUNDLE}}/Contents/Resources/"
      - codesign --force --sign - "{{.BUNDLE}}"
    silent: true
  run:
    deps: [bundle]
    cmds:
      - "{{.BUNDLE}}/Contents/MacOS/{{.APP_NAME}}"
  install:
    deps: [bundle]
    cmds:
      - mkdir -p "{{.APP_DIR}}"
      - rm -rf "{{.APP_DIR}}/{{.APP_NAME}}.app"
      - cp -R "{{.BUNDLE}}" "{{.APP_DIR}}/"
  uninstall:
    cmds:
      - rm -rf "{{.APP_DIR}}/{{.APP_NAME}}.app"
    silent: true
  clean:
    cmds:
      - rm -rf .build
    silent: true
